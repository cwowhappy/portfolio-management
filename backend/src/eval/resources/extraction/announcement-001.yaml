- id: announcement-005-buyback-related-transaction
  kind: announcement
  title: 恒立机械：关于以集中竞价交易方式回购公司股份暨与关联方签订日常关联交易协议的公告
  pdf_text: |-
    证券代码：002981        证券简称：恒立机械        公告编号：2026-102

    一、回购方案基本情况
    公司拟以自有资金或自筹资金以集中竞价交易方式回购公司部分社会公众股份，回购资金总额
    不低于人民币5,000万元（含）且不超过人民币10,000万元（含），回购价格不超过12.50元/股，
    回购期限自董事会审议通过回购方案之日起不超过12个月。本次回购的股份将依法予以注销并
    减少注册资本。

    二、关联交易情况
    因业务发展需要，公司与关联方恒立控股集团有限公司签订《综合技术服务协议》，由其为公司
    提供厂区动力设备运行维护服务，协议总金额为人民币3,200万元，服务期限两年。恒立控股集团
    有限公司为公司控股股东，本次交易构成关联交易，已经公司独立董事专门会议事前认可并经
    董事会审议通过，关联董事已回避表决。
  expect:
    metrics: {}
    dividend_desc: null
    undisclosed: ["营业收入", "归母净利润", "归母净利润同比", "扣非净利润", "毛利率", "分红"]
    ann_types: ["BUYBACK", "RELATED_TRANSACTION"]

- id: announcement-006-increase-hold-wide-column
  kind: announcement
  title: 蓝海科技：关于控股股东增持公司股份计划的公告
  pdf_text: |-
    证券代码：688260        证券简称：蓝海科技        公告编号：2026-045

    公司于近日收到控股股东宁波蓝海投资管理有限公司（以下简称"蓝海投资"）出具的《关于增
    持蓝海科技股份计划的告知函》，现将有关情况公告如下：

    一、增持主体基本情况
    蓝海投资目前持有公司股份86,400,000股，占公司总股本的31.20%，为公司控股股东。

    二、增持计划的主要内容
    1.增持目的：蓝海投资基于对公司未来持续稳定发展的信心及对公司长期投资价值的认可，
    拟实施本次增持计划。
    2.增持金额：蓝海投资计划自本公告披露之日起6个月内，通过上海证券交易所交易系统以集中
    竞价交易方式增持公司股份，增持金额不低于人民币1,000万元且不超过人民币2,000万元。
    3.资金来源：蓝海投资自有资金及自筹资金。
    4.增持计划实施期间，蓝海投资承诺在增持期间及法定期限内不减持公司股份。
  expect:
    metrics: {}
    dividend_desc: null
    undisclosed: ["营业收入", "归母净利润", "归母净利润同比", "扣非净利润", "毛利率", "分红"]
    ann_types: ["INCREASE_HOLD"]

- id: announcement-007-earnings-forecast-loss-negative
  kind: announcement
  title: 金山矿业：2026年度业绩预告——预计归母净利润亏损约3.10亿元 上年同期盈利1.85亿元
  pdf_text: |-
    证券代码：000826        证券简称：金山矿业        公告编号：2027-002

    一、本期业绩预计情况
    1.业绩预告期间：2026年1月1日至2026年12月31日。
    2.业绩预告情况：业绩亏损。
    项目                                    本报告期                        上年同期
    归属于上市公司股东的净利润    亏损：约31,000万元      盈利：18,500.16万元
    扣除非经常性损益后的净利润    亏损：约32,500万元      盈利：17,920.44万元
    基本每股收益                    亏损：约0.62元/股      盈利：0.37元/股

    二、业绩变动原因说明
    报告期内，受主要产品锌、铅价格持续下行影响，公司预计实现归属于上市公司股东的净利润
    亏损约3.10亿元，较上年同期由盈转亏；扣除非经常性损益后的净利润亏损约3.25亿元。公司
    已对相关存货计提跌价准备，并对部分低品位矿山采取停产减亏措施。
  expect:
    metrics:
      netProfitYi: -3.10
      deductedProfitYi: -3.25
    dividend_desc: null
    undisclosed: ["毛利率", "分红"]
    ann_types: ["EARNINGS_FORECAST"]
