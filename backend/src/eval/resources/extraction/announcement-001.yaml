# 公告抽取质量 eval 题库（MS-21 Task 9）：样本自拟、语体真实感（公告标题 + PDF 正文文本段，
# 含具体数字与口径语——万元/亿元换算、同比口径、利润分配预案措辞）。公司名与数字均为虚构。
# kind: announcement（缺省 news——新闻题见 news-001.yaml）。
# expect 口径（与 ExtractionEvalRunner 的公告比对实现对齐）：
#   metrics      —— 五数值字段（revenueYi/netProfitYi/netProfitYoyPct/deductedProfitYi/grossMarginPct，
#                   camelCase 键=存储契约组件名）期望 BigDecimal compareTo 等值（容忍尾零差异）；
#                   缺失的键=不断言该字段（区间披露的预告题只断言单锚数值）
#   dividend_desc —— 期望非 null=断言实际非 null（披露识别命中，措辞不强一致——报告留实得值人工抽阅）；
#                   null 断言不经此字段（YAML 显式 null 与缺省不可区分），改由 undisclosed 含「分红」联动守护
#   undisclosed  —— 期望每项须在实际 undisclosed 命中（六规范名：营业收入/归母净利润/归母净利润同比/
#                   扣非净利润/毛利率/分红），且规范名联动断言对应字段为 null（未披露契约）
#   ann_types    —— 期望枚举名集 ⊆ 实际集（栏目直判 ∪ LLM 精判并集语义，允许多）
# 覆盖：业绩预告（预增单锚/预亏负数）、业绩快报、正式年报（全字段）、未披露字段边界（无分红方案
#       →dividendDesc null + undisclosed 含「分红」）、多类型标签（回购+关联交易）、宽栏目类（增持——
#       与回购题同为非业绩类六字段全 null 全进 undisclosed 的契约断言面）。
# 样本自洽约束（fix round 1 裁定）：表列本期/上年数字与叙述同比百分比必须互证（差/上年基数
# 四舍五入到叙述的小数位），严禁出现互相矛盾的两套口径。
- id: announcement-001-earnings-forecast-increase
  kind: announcement
  title: 华兴数控：2026年度业绩预告——预计净利润约31.20亿元 同比增长55.10%左右
  pdf_text: |-
    证券代码：002157        证券简称：华兴数控        公告编号：2027-001

    一、本期业绩预计情况
    1.业绩预告期间：2026年1月1日至2026年12月31日。
    2.业绩预告情况：同向上升。
    项目                                本报告期                        上年同期
    归属于上市公司股东的净利润    盈利：约312,000万元        盈利：201,160.85万元
                                    比上年同期增长：约55.10%
    扣除非经常性损益后的净利润    盈利：约305,000万元        盈利：198,422.31万元
    基本每股收益                    盈利：约1.56元/股          盈利：1.01元/股

    二、业绩预告预审计情况
    本业绩预告未经会计师事务所审计。报告期内，公司主营业务收入保持增长，预计实现营业收入约
    415.20亿元，主要系下游数控机床需求回暖、高端型号占比提升所致。

    三、上年同期经营业绩
    2025年度：营业收入368.35亿元，归属于上市公司股东的净利润20.12亿元。
  expect:
    metrics:
      revenueYi: 415.20
      netProfitYi: 31.20
      netProfitYoyPct: 55.10
    dividend_desc: null
    undisclosed: ["毛利率", "分红"]
    ann_types: ["EARNINGS_FORECAST"]

