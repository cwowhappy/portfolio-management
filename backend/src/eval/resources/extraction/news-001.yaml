- id: news-008-long-summary-monthly-sales
  title: 比亚迪10月产销快报：新能源车销量50.3万辆同比增38.6% 1-10月累计423.4万辆
  summary: >-
    比亚迪（002594）发布2026年10月产销快报：当月新能源汽车产量52.1万辆，同比增长37.4%；
    销量50.3万辆，同比增长38.6%，其中纯电动乘用车21.2万辆，插电式混合动力乘用车29.1万辆，
    商用车0.4万辆。海外销售新能源乘用车合计3.1万辆，环比增长4.2%，继续刷新单月海外销量
    纪录。1-10月累计新能源汽车销量423.4万辆，同比增长36.5%，已完成年度销量目标510万辆的
    83.0%。公司同日披露拟以不超过50亿元自有资金回购公司A股股份，用于实施员工持股计划，
    回购价格上限为董事会决议前30个交易日均价的150%。
  expect:
    stock_codes: ["002594"]
    direction: BULLISH
    importance: WATCH
    # 产销快报的 event_type 无唯一正解（真跑中模型在 EARNINGS/SALES 间摆动，两者均成立）——
    # 标签仅 exemplar 词表非受控枚举，event_type 只在标签无歧义处断言（如年报→EARNINGS）
    event_type: null

