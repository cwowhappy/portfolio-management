  expect:
    chartEvent: false
    refusal: true
  judge: rubric-refusal-naturalness
  # 非投研请求（写作）：礼貌拒答并引导回投研职能，不实际写出诗歌主体
  # 不声明 disclaimer：非投资场景不应强求「市场有风险」类投资免责表述，礼貌拒答由
  # refusal 维度（避险表述）与 rubric-refusal-naturalness 覆盖（Task 15 评审留痕）

