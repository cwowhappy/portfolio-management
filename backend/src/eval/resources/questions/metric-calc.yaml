# 指标计算类基线 10 题（MS-30 E1，category=METRIC_CALC——大写与 EvalRegressionJudge.NEW_CATEGORIES
# 逐字对齐，错字则分类判定静默旁路）：PE 推导（价÷EPS）/日内振幅/涨跌额与涨跌幅推导/跨股 PE 倍数/
# 三标的 PE 均值/销售净利率/总市值估算（亿元→万亿两段式）/估值分位线性插值/区间低点反弹涨幅/
# 个股对大盘超额涨幅。每题 expect 断言 dataFidelityTolerance（容差维面）+ judge rubric-answer-quality；
# entityAlignment 全量声明（计算类先对准标的/数据源，容差锚才有意义——来源工具钉
# get_financials/get_news 的两题用来源工具对齐，其余 search_stock）。
#
# 容差维面口径（需求决策 #15，AssertionEngine.dataFidelityTolerance）：
# - 锚 anchorValues 是题目计算链的期望推导值（非桩字面值，故不做 dataFidelity 式桩 JSON 自洽校验，
#   计算链自洽性由各题注释写明期望推导路径守护）；tolerancePct 缺省用 invest.eval.calc-tolerance-pct
#   （默认 2，EvalRunner 读配置下传），唯估值分位题声明 5（分位口径的分母约定差异最大）。
# - 数值抽取边界：答案中的阿拉伯数字（千分位归一）、负号不参与（幅度匹配——模型常写「下跌1.17%」
#   无负号，涨跌方向表述由 judge 评）；中文数字（"百分之五十二"）不抽取，题面以「百分比/保留 N 位
#   小数」引导阿拉伯数字表述。逐锚核对：每锚在抽取数字集中找任一 ±pct% 内命中，全部锚命中才过。
# - 覆盖面裁定：PB 推导不做——get_financials 的 LLM 摘要只示 EPS/营收/净利/ROE/毛利率，
#   bps 只在双通道剥离的表格 spec 里（模型不可见），价÷bps 推导不可达；以净利率/市值/超额收益补位。
#   涨跌幅题与 MARKET_FACT 的读数复述有语义重叠（change/changePct 直查可得）——题面写明推导式
#   （涨跌额÷昨收），读数与推导殊途同归均锚同一正确值。
# 桩数据自洽（沿 market-fact.yaml 同一套股票池 600519/000001/300750，数值跨题跨库同套）：
# 财务 stub 的 eps×12.56亿股=净利、价÷eps≈pe、价÷bps≈pb（bps 虽不可见仍保持自洽）；
# K 线升序（最旧在前，klineSummary 取末根为最新）、末根与 09-14 收盘行情同日同值
# （close=最新价 1735.86、low=当日低 1705.02、amount=当日额 55.47 亿），volume 按「股」口径
# 与 amount 同量级（3215400 股 × ~1725 元 ≈ 55.47 亿）；amplitudePct=(high−low)÷昨收。
# 注意（沿 market-fact.yaml 头注释）：quotes/financials/klines/news 的 code 键一律加引号——
# 裸 000001 会被 YAML 1.1 按八进制解析成 1，桩查找静默 miss；不用 YAML anchor/alias。

- id: mc-pe-from-eps
  category: METRIC_CALC
  mode: stub
  turns:
    - 按贵州茅台的最新价和最新报告期的每股收益，帮我算一下市盈率（PE=价格÷EPS），结果保留两位小数。
  expect:
    # get_quote 与 get_financials 的先后属良性路径分叉（计算需两源）——只锚 search 先行，
    # 实体对齐钉在 get_financials 上（EPS 唯一来源，防只读 quote.pe 的旁路）
    toolSequence: ["search_stock"]
    toolSequenceMatch: prefix
    entityAlignment: {tool: "get_financials", paramContains: "600519"}
    chartEvent: true
    disclaimer: true
    refusal: false
    dataFidelityTolerance:
      # 计算链：1735.86 ÷ 77.5 = 22.398 ≈ 22.40（与 quote.pe 22.4 同量级自洽；
      # 模型把 1735.86 舍入 1736 或 eps 舍入 77.5 本身均在 ±2% 内）
      anchorValues: [22.4]
  judge: rubric-answer-quality
  stubData:
    search:
      - {code: "600519", name: 贵州茅台, market: "1", marketName: 沪市}
    quotes:
      "600519":
        code: "600519"
        name: 贵州茅台
        price: 1735.86
        change: 26.02
        changePct: 1.52
        open: 1712.0
        high: 1741.88
        low: 1705.02
        prevClose: 1709.84
        volume: 3215400
        amount: 55.47
        pe: 22.4
        pb: 8.11
        time: "2026-09-14 15:00:00"
    financials:
      "600519":
        code: "600519"
        name: 贵州茅台
        pe: 22.4
        pb: 8.11
        indicators:
          # eps 77.5 × 12.56 亿股 = 973.4 亿（净利自洽）；价÷bps = 1735.86÷8.11 ≈ 214.01
          - reportDate: "2026-06-30"
            eps: 77.5
            bps: 214.01
            totalRevenue: 150000000000
            netProfit: 97340000000
            weightedRoe: 32.5
            grossMargin: 91.5

