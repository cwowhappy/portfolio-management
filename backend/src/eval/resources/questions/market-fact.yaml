# 行情事实类基线 10 题（MS-30 E1，category=MARKET_FACT——大写与 EvalRegressionJudge.NEW_CATEGORIES
# 逐字对齐，错字则分类判定静默旁路）：价格直查（代码直查免搜）/涨跌幅/市值/成交额/多标的对比/
# 盘中时点敏感（独立 11:30 盘中快照，非收盘数据集）/边界空结果如实复述/单位换算（万元→元）/
# 大盘指数直查/估值指标直查。每题 expect 断言 dataFidelity+judge rubric-answer-quality；
# entityAlignment 除无参工具的大盘题（无入参可对齐，沿 st-overview-market 先例）外全量声明。
# 桩数据自洽（沿 extraction 题库先例）：changePct=change/prevClose 四舍五入两位、amount(亿元)
# 与 volume×均价同量级、盘中快照的昨收/开盘与收盘数据集同日且高低/量额不越过收盘集
# （high 1732 ≤ 1741.88、low 1706.2 ≥ 1705.02、量额约为半日量级）；股票池沿用 600519/000001/300750。
# 口径说明：Quote 无市值字段——市值事实取自桩新闻文本（2.18 万亿 ≈ 1735.86 元 × 总股本 12.56 亿股，
# 自洽）；单位换算题的 dataFidelity 锚钉新闻原文「420,000万元」的复述（两段式提问逼出复述），
# 换算正确性（42 亿元）由 judge rubric 评；涨跌幅题不锚负号（模型常写「下跌1.17%」）。
# 注意（沿 single-turn.yaml 头注释）：quotes 的 code 键一律加引号——裸 000001 会被 YAML 1.1 按
# 八进制解析成 1，桩查找静默 miss；不用 YAML anchor/alias 复用数据集（jackson-dataformat-yaml
# 2.20 会把别名解析成锚点名字符串），故各题桩数据完整展开、数值跨题保持同一套。

- id: mf-quote-maotai-by-code
  category: MARKET_FACT
  mode: stub
  turns:
    - 600519 现在的最新价是多少？
  expect:
    # 用户直接给代码：直查 get_quote 与先 search 后查均属良性路径——评估点在实体对齐与数值
    # 保真，不在路径（不声明 toolSequence，免 prepend 误伤）
    entityAlignment: {tool: "get_quote", paramContains: "600519"}
    chartEvent: false
    disclaimer: true
    refusal: false
    dataFidelity:
      answerContains: ["1735.86"]
  judge: rubric-answer-quality
  stubData:
    quotes:
      "600519":
        code: "600519"
        name: 贵州茅台
        price: 1735.86
        change: 26.02
        changePct: 1.52
        open: 1712.0
        high: 1741.88
        low: 1705.02
        prevClose: 1709.84
        volume: 3215400
        amount: 55.47
        pe: 22.4
        pb: 8.11
        time: "2026-09-14 15:00:00"

