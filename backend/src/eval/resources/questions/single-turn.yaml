# 单轮行情问答 12 题（+ sample-quote-single-turn 共 13 题）：工具序列（先 search_stock 后查）、
# 实体对齐（「茅台」→600519）、双通道完整性（chartEvent）、数值保真（dataFidelity 锚点=桩值）。
# 桩数据自洽：全部锚点逐字取自本题 stubData（loader 装载校验）；股票池固定 600519/000001/300750。
# 注意①：quotes 的 code 键一律加引号——裸 000001 会被 YAML 1.1 按八进制解析成 1，桩查找静默 miss。
# 注意②：不用 YAML anchor/alias 复用数据集——jackson-dataformat-yaml 2.20 会把别名解析成
# 锚点名字符串（实测），故各题桩数据完整展开、数值跨题保持同一套。

- id: st-quote-pingan
