# 多轮指代消解 7 题：第二轮用指代（「它呢」「那…呢」）承接第一轮实体——
# multiTurnMemory 维度断言指定轮的工具调用仍对准前轮实体（服务端记忆 + 指代承接）。
# 桩数据数值与 single-turn.yaml 同一套（600519/000001/300750 固定股票池，跨题可比）。
# 数据必要性：第二轮问句一律指向第一轮工具结果里没有的字段（如一轮查报价、二轮问最新财报
# 毛利率），迫使对实体重新发起调用——纯回顾第一轮结果即可答的问法测不出承接（Task 15 修复）。

- id: mt-quote-followup
  category: multi-turn
  mode: stub
  turns:
    - 茅台现在多少钱？
    - 那它的最新财报毛利率呢？
  expect:
    toolSequence: ["search_stock", "get_quote"]
    toolSequenceMatch: prefix
    entityAlignment: {tool: "search_stock", paramContains: 茅台}
    memoryFollowUp: {turnIndex: 2, toolContains: "get_financials", paramContains: "600519"}
    chartEvent: true
    disclaimer: true
    refusal: false
    dataFidelity:
      answerContains: ["1735.86", "91.8"]
  judge: rubric-answer-quality
  # 毛利率只在 get_financials（报价无此字段）：第二轮必须凭记忆带 600519 重查财务
  stubData:
    search:
      - {code: "600519", name: 贵州茅台, market: "1", marketName: 沪市}
    quotes:
