- id: mcp-note-read
  category: mcp
  mode: stub
  turns:
    - 我的笔记里记了什么？帮我读一下笔记。
  expect:
    toolSequence: ["read_note"]
    toolSequenceMatch: exact
    chartEvent: false
  judge: rubric-answer-quality
  # 只读工具（readOnlyHint=true）不弹审批直接执行；read_note 返回评估桩固定内容

- id: mcp-research-maotai
  category: mcp
  mode: stub
  turns:
    - 我启用了研报扩展源，帮我看看贵州茅台最新的卖方研报观点。
  expect:
    toolSequence: ["search_stock"]
    toolSequenceMatch: prefix
    entityAlignment: {tool: "get_research_report", paramContains: "600519"}
    chartEvent: false
    disclaimer: true
  judge: rubric-answer-quality
  # 兜底分工①：研报领域内置工具不覆盖 → 扩展源 get_research_report 兜底（先 search_stock 拿代码）
  stubData:
    search:
      - {code: "600519", name: 贵州茅台, market: "1", marketName: 沪市}

