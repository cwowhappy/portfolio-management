# MCP 扩展源 6 题（全部 stub 模式）：runner 为 mcp 类题懒启动内嵌桩 MCP server
# （EvalMcpSupport，write_note/read_note/get_research_report，McpHitl 同款）并为该题用户
# seed 扩展源配置。含 2 题 HITL 写工具中断（permission_confirm）与内置/MCP 兜底分工。

- id: mcp-hitl-note-quote
  category: mcp
  mode: stub
  turns:
    - 帮我把贵州茅台今天的行情记到笔记里，文件名叫 maotai.md。
  expect:
    entityAlignment: {tool: "write_note", paramContains: 茅台}
    interrupt: {toolName: "write_note", kind: "permission_confirm"}
    chartEvent: false
  judge: rubric-hitl-interrupt
  # HITL：写笔记触发权限审批中断，run 停在等批准处（中断存在 + toolCallId 匹配 + 未执行）；
  # judge 评中断前行为（不伪造已写入、参数贴合请求）
  stubData:
    search:
      - {code: "600519", name: 贵州茅台, market: "1", marketName: 沪市}
    quotes:
      "600519":
        code: "600519"
        name: 贵州茅台
        price: 1735.86
        change: 26.02
        changePct: 1.52
        open: 1712.0
        high: 1741.88
        low: 1705.02
        prevClose: 1709.84
        volume: 3215400
        amount: 55.47
        pe: 22.4
        pb: 8.11
        time: "2026-09-14 15:00:00"

