# MS-30 跟进：固定集成测试类执行序（字母序）——类序原先取决于编译输出文件发现序，
# clean rebuild 即洗牌，曾两次暴露类序敏感失败（provisioner 建表残留 eval_schema ×
# 无 schema 限定的表计数断言）。固定后失败稳定可复现；若固定序暴露新的污染链，
# 正确修法是补该测试的 @AfterAll 自清（MS-30 Task 2 先例），不是换排序。
# 仅挂 integrationTest 源集：test 无 Testcontainers/共享容器，bdd 单一 @Suite 入口
# 走 cucumber 引擎，均无类序敏感面。
junit.jupiter.testclass.order.default=org.junit.jupiter.api.ClassOrderer$ClassName
