spring:
  application:
    name: invest-agent
  servlet:
    multipart:
      # CSV 导入端点自校 1MB；容器上限放宽到 2MB——Boot 默认 max-file-size 恰为 1MB，
      # 会把带 multipart 封包开销的边界文件在解析层之前先拒（MaxUploadSizeExceededException）
      max-file-size: 2MB
      max-request-size: 2MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/invest}
    username: ${POSTGRES_USER:invest}
    password: ${POSTGRES_PASSWORD:invest}
  jpa:
    hibernate:
      ddl-auto: none        # 由 Flyway 管 schema
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax      # 同源反代 + Lax → 关 CSRF 的安全前提（ADR-0007）

logging:
  level:
    # AgentScope starter 的 MVC 控制器在客户端断开 SSE 流时打印无害噪音
    # （SSE connection error / ResponseBodyEmitter has already completed），予以关闭；
    # 真正的 AG-UI 异常会抛给我们的 GlobalExceptionHandler 记录。
    io.agentscope.spring.boot.agui.mvc.AguiMvcController: OFF

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

agentscope:
  agui:
    path-prefix: /agui
    # Agent bean 名与 agent id 均为 invest
    default-agent-id: invest
    # 服务端以 HarnessAgent 的 stateStore 持久化会话历史，前端只发最新一条用户消息
    server-side-memory: true
    enable-reasoning: true
    emit-tool-call-args: true
    emit-token-usage: true
    # 经 Next.js 同源反代，无需 CORS
    cors-enabled: false
    run-timeout: 5m

invest:
  llm:
    provider: deepseek
    model: ${DEEPSEEK_MODEL:deepseek-v4-flash}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
  security:
    remember-me-key: ${REMEMBER_ME_KEY:}
  market:
    connect-timeout: 3s
    read-timeout: 5s
    rate-limit-per-second: 5
    max-attempts: 3
    retry-backoff-millis: 300
    acquire-timeout-millis: 2000
    cache:
      max-entries: 10000
      quote-ttl: 15s
      kline-ttl: 5m
      search-ttl: 10m
      financials-ttl: 1h
      news-ttl: 5m
      overview-ttl: 15s
  mcp:
    connect-timeout: 10s
    tool-timeout: 30s
    pool-max-size: 20
    harness:
      workspace: .agentscope/workspace
      state-root: .agentscope/state
      compaction:
        trigger-messages: 30
        keep-messages: 10
        flush-before-compact: true
      memory:
        flush-min-gap: 30m
