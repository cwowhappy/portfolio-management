plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

jacoco {
    // 0.8.13 完整支持 Java 21 字节码（record / switch 表达式）
    toolVersion = '0.8.13'
}

group = 'com.portfolio'
version = '0.1.0'
description = '证券投资分析一期 · AI Agent 后端（Spring Boot 4 + AgentScope Java + DeepSeek）'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    // 国内镜像优先，官方中央仓库兜底
    maven { url = uri("https://maven.aliyun.com/repository/central") }
    mavenCentral()
}

dependencies {
    implementation('org.springframework.boot:spring-boot-starter-web') {
        // 移除默认的 Jackson 3，改用 Jackson 2（AgentScope AG-UI 模型基于 Jackson 2 注解）
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-jackson'
    }
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-jackson2'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.postgresql:postgresql'
    // Spring Boot 4 中 Flyway 自动配置迁至独立 starter（spring-boot-autoconfigure 已不含 flyway 自动配置）
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // AgentScope Java 2.0.1
    implementation 'io.agentscope:agentscope-core:2.0.1'
    // DeepSeek 模型支持（OpenAI 兼容扩展）
    implementation 'io.agentscope:agentscope-extensions-model-openai:2.0.1'
    // AG-UI 协议端点
    implementation 'io.agentscope:agentscope-agui-spring-boot-starter:2.0.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spring Boot 4 中 MockMvc 测试自动配置（AutoConfigureMockMvc）迁至 spring-boot-starter-webmvc-test
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Testcontainers 2.x 坐标已更名为 testcontainers-*（Spring Boot 4.0.3 经 BOM 管理）
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    // 架构守护：分包规范（依赖方向/无环/落位规则）由 ArchUnit 测试强制
    testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // 每次跑测试即生成覆盖率报告并执行门槛校验（指令/分支 ≥ 80%）
    finalizedBy jacocoTestReport, jacocoTestCoverageVerification
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'INSTRUCTION'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}
