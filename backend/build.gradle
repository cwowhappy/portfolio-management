plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.portfolio'
version = '0.1.0'
description = '证券投资分析一期 · AI Agent 后端（Spring Boot 4 + AgentScope Java + DeepSeek）'

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

repositories {
    // 国内镜像优先，官方中央仓库兜底
    maven { url = uri("https://maven.aliyun.com/repository/central") }
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // AgentScope Java 2.0.1
    implementation 'io.agentscope:agentscope-core:2.0.1'
    // DeepSeek 模型支持（OpenAI 兼容扩展）
    implementation 'io.agentscope:agentscope-extensions-model-openai:2.0.1'
    // AG-UI 协议端点
    implementation 'io.agentscope:agentscope-agui-spring-boot-starter:2.0.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
