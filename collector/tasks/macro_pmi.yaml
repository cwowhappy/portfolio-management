task_code: macro_pmi
task_name: 宏观指标采集-制造业PMI
# MS-22 设计 §6：与 CPI/PPI 同源（stats_table 形态），标题关键词「采购经理指数」；
# PMI 月末发布、官方 PMI 无季调（v1 不采 Caitin），标题关键词天然排除非制造业。
source_ids:
  - { source_id: pmi, type: plugin, class: pmi }
converter: field_mapping_macro
calc: null
# 同族 validator：value not_null hard + |value|<10^8 soft（PMI 水平值 0~100 域内，
# 统一域只拦解析层漏网的明显坏值）
validator:
  - { field: indicator, check: required, level: hard }
  - { field: period, check: required, level: hard }
  - { field: value, check: not_null, level: hard }
  - { field: value, check: range, min: -99999999, max: 99999999, level: soft }
target_table: intelligence_macro_series
schedule: { type: cron, cron: "0 11 10-13 * *" }
enabled: true
trading_day_gated: false
depends_on: null
retry_max: 2
retry_backoff: fixed
