services:
  db:
    image: postgres:16-alpine
    container_name: invest-agent-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-invest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invest}
      POSTGRES_DB: ${POSTGRES_DB:-invest}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-invest}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: invest-agent-backend
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-invest}
      POSTGRES_USER: ${POSTGRES_USER:-invest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-invest}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      REMEMBER_ME_KEY: ${REMEMBER_ME_KEY:-}
      # 飞书自建应用（P1 原则预警；未配置时巡检静默跳过）
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_ALERT_CHAT_ID: ${FEISHU_ALERT_CHAT_ID:-}
      FEISHU_OWNER_USERNAME: ${FEISHU_OWNER_USERNAME:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/api/agent/health"]
      interval: 20s
      timeout: 5s
      retries: 5
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    container_name: invest-agent-frontend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  collector:
    build: ./collector
    container_name: invest-agent-collector
    environment:
      # 数据库名与 db 服务保持一致（默认 invest，随 ${POSTGRES_DB} 统一切换）
      DATABASE_URL: postgresql://${POSTGRES_USER:-invest}:${POSTGRES_PASSWORD:-invest}@db:5432/${POSTGRES_DB:-invest}
      TUSHARE_TOKEN: ${TUSHARE_TOKEN}
      # P0-2 终态告警（opt-in）：配置任意 JSON POST webhook；未配置时告警静默关闭
      COLLECTOR_ALERT_WEBHOOK: ${COLLECTOR_ALERT_WEBHOOK:-}
      # 飞书群自定义机器人（优先于上方通用 webhook）：卡片告警；secret 为签名校验（可选）
      FEISHU_BOT_WEBHOOK: ${FEISHU_BOT_WEBHOOK:-}
      FEISHU_BOT_SECRET: ${FEISHU_BOT_SECRET:-}
      TZ: Asia/Shanghai
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
