name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test
        working-directory: backend
        run: ./gradlew check --console=plain

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        working-directory: frontend
        run: pnpm lint
      - name: Test
        working-directory: frontend
        run: pnpm test

  collector:
    name: Collector tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collector
          POSTGRES_PASSWORD: collector
          POSTGRES_DB: collector
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collector"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 供需要真实 PG 的集成测试使用（testcontainers 用 runner 自带 docker 亦可）
      DATABASE_URL: postgresql://collector:collector@localhost:5432/collector
      TUSHARE_TOKEN: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: collector/requirements.txt
      - name: Install
        working-directory: collector
        run: pip install -r requirements.txt
      - name: Ruff lint
        working-directory: collector
        run: ruff check .
      - name: Ruff format check
        working-directory: collector
        run: ruff format --check .
      - name: Import-linter 分层合约
        working-directory: collector
        run: lint-imports
      - name: Test
        working-directory: collector
        run: pytest -q --cov=collector --cov-fail-under=80
